name: Restore main from backup

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore project tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git read-tree bcef9ac7ddadac5f6817a11291dbe712408c51e0
          git rm -r --cached .github > /dev/null
          GITHUB_TREE=$(git rev-parse HEAD:.github)
          git read-tree --prefix=.github/ "$GITHUB_TREE"
          TREE=$(git write-tree)
          NEW_COMMIT=$(git commit-tree "$TREE" -p HEAD -m "restore: recover project files")
          git push origin "$NEW_COMMIT:refs/heads/main"
